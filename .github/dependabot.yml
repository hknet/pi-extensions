version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Defer compiler majors until the pinned Pi SDK adopts them.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # Keep Node declarations at the exact version tested with the pinned Pi SDK.
      # Revisit when Pi upgrades its Node types baseline.
      - dependency-name: "@types/node"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
